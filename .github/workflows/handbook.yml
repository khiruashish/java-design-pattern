name: Handbook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test the Java examples
        run: mvn -B -q -f code/pom.xml test

      - name: Check the documented outputs match the code
        run: code/run-demos.sh --check

      - name: Build the standalone design-patterns folder and check its outputs
        run: |
          mvn -B -q -f design-patterns/pom.xml test
          design-patterns/run-demos.sh --check

      - name: Run coding-interview solutions (each must print PASS; outputs must match the docs)
        run: coding-interview/run-all.sh --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site (fails on broken links or missing snippets)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
